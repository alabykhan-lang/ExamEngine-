<!-- ══ AUTH SCREEN ════════════════════════ -->
<div id="screen-auth" class="visible">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-mark">E</div>
      <div class="auth-logo-name">ExamEngine Pro</div>
    </div>

    <!-- Tabs -->
    <div style="display:flex;background:var(--surf2);border:1.5px solid var(--bdr);border-radius:var(--rs);padding:4px;gap:4px;margin-bottom:24px;">
      <button id="tabLogin" onclick="authTab('login')" style="flex:1;padding:9px;border-radius:7px;border:none;font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;transition:all .2s;">Sign In</button>
      <button id="tabRegister" onclick="authTab('register')" style="flex:1;padding:9px;border-radius:7px;border:none;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:var(--mute);transition:all .2s;">Register</button>
    </div>

    <div class="auth-err" id="authErr"></div>

    <!-- Sign In -->
    <div id="authLoginPanel">
      <div class="auth-field">
        <label>Email Address</label>
        <input type="email" id="authEmail" placeholder="you@school.edu.ng" autocomplete="email"/>
      </div>
      <div class="auth-field">
        <label>Password</label>
        <div class="auth-pw-wrap">
          <input type="password" id="authPass" placeholder="••••••••" autocomplete="current-password"/>
          <button type="button" class="auth-eye" onclick="togglePw('authPass',this)" tabindex="-1" aria-label="Show/hide password">
            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div style="text-align:right;margin-top:-10px;margin-bottom:14px;">
        <a href="#" onclick="forgotPassword();return false;" style="font-size:12px;color:var(--blue);text-decoration:none;font-family:var(--sans);">Forgot password?</a>
      </div>
      <button class="auth-btn" id="authBtn" onclick="doLogin()">Sign In →</button>
    </div>

    <!-- Register -->
    <div id="authRegisterPanel" style="display:none;">
      <div class="auth-field">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="e.g. Amina Yusuf" autocomplete="name"/>
      </div>
      <div class="auth-field">
        <label>Email Address</label>
        <input type="email" id="regEmail" placeholder="you@school.edu.ng" autocomplete="email"/>
      </div>
      <div class="auth-field">
        <label>Password</label>
        <div class="auth-pw-wrap">
          <input type="password" id="regPass" placeholder="Min 6 characters" autocomplete="new-password"/>
          <button type="button" class="auth-eye" onclick="togglePw('regPass',this)" tabindex="-1" aria-label="Show/hide password">
            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div class="auth-field">
        <label>Confirm Password</label>
        <div class="auth-pw-wrap">
          <input type="password" id="regPass2" placeholder="Repeat password" autocomplete="new-password"/>
          <button type="button" class="auth-eye" onclick="togglePw('regPass2',this)" tabindex="-1" aria-label="Show/hide password">
            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button class="auth-btn" id="regBtn" onclick="doRegister()">Create Account →</button>
    </div>

    <div class="auth-spinner" id="authSpinner">Please wait…</div>
  </div>
</div>
