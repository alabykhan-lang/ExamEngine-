<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=5.0"/>
<title>ExamEngine Pro v12.5 — Teacher &amp; Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css"/>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- ══ AUTH SCREEN ════════════════════════ -->
<div id="c-auth" class="auth-active">
<div id="screen-auth" class="visible">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-mark">E</div>
      <div class="auth-logo-name">ExamEngine Pro</div>
    </div>

    <!-- Tabs -->
    <div style="display:flex;background:var(--surf2);border:1.5px solid var(--bdr);border-radius:var(--rs);padding:4px;gap:4px;margin-bottom:24px;">
      <button id="tabLogin" onclick="authTab('login')" style="flex:1;padding:9px;border-radius:7px;border:none;font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;transition:all .2s;">Sign In</button>
      <button id="tabRegister" onclick="authTab('register')" style="flex:1;padding:9px;border-radius:7px;border:none;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:var(--mute);transition:all .2s;">Register</button>
    </div>

    <div class="auth-err" id="authErr"></div>

    <!-- Sign In -->
    <div id="authLoginPanel">
      <div class="auth-field">
        <label>Email Address</label>
        <input type="email" id="authEmail" placeholder="you@school.edu.ng" autocomplete="email"/>
      </div>
      <div class="auth-field">
        <label>Password</label>
        <div style="position:relative;display:flex;align-items:center;">
          <input type="password" id="authPass" placeholder="••••••••" autocomplete="current-password" style="flex:1;padding-right:38px;"/>
          <button type="button" onclick="(function(b){var i=document.getElementById('authPass');var s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'🙈':'👁';})(this)" style="position:absolute;right:8px;background:none;border:none;cursor:pointer;font-size:15px;padding:2px 4px;line-height:1;" title="Show/hide password">👁</button>
        </div>
      </div>
      <div style="text-align:right;margin-top:-8px;margin-bottom:16px;">
        <a href="#" onclick="forgotPassword();return false;" style="font-size:12px;color:var(--blue);text-decoration:none;font-family:var(--sans);font-weight:600;">Forgot password?</a>
      </div>
      <button class="auth-btn" id="authBtn" onclick="doLogin()">Sign In →</button>
    </div>

    <!-- Register -->
    <div id="authRegisterPanel" style="display:none;">
      <div class="auth-field">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="e.g. Amina Yusuf" autocomplete="name"/>
      </div>
      <div class="auth-field">
        <label>Email Address</label>
        <input type="email" id="regEmail" placeholder="you@school.edu.ng" autocomplete="email"/>
      </div>
      <div class="auth-field">
        <label>Password</label>
        <div style="position:relative;display:flex;align-items:center;">
          <input type="password" id="regPass" placeholder="Min 6 characters" autocomplete="new-password" style="flex:1;padding-right:38px;"/>
          <button type="button" onclick="(function(b){var i=document.getElementById('regPass');var s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'🙈':'👁';})(this)" style="position:absolute;right:8px;background:none;border:none;cursor:pointer;font-size:15px;padding:2px 4px;line-height:1;" title="Show/hide password">👁</button>
        </div>
      </div>
      <div class="auth-field">
        <label>Confirm Password</label>
        <div style="position:relative;display:flex;align-items:center;">
          <input type="password" id="regPass2" placeholder="Repeat password" autocomplete="new-password" style="flex:1;padding-right:38px;"/>
          <button type="button" onclick="(function(b){var i=document.getElementById('regPass2');var s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'🙈':'👁';})(this)" style="position:absolute;right:8px;background:none;border:none;cursor:pointer;font-size:15px;padding:2px 4px;line-height:1;" title="Show/hide password">👁</button>
        </div>
      </div>
      <button class="auth-btn" id="regBtn" onclick="doRegister()">Create Account →</button>
    </div>

    <div class="auth-spinner" id="authSpinner">Please wait…</div>
  </div>
</div>
</div>

<!-- ══ SIDEBAR ══════════════════════════ -->
<div id="c-sidebar">
<div id="sb-overlay" onclick="closeSidebar()"></div>
<div id="sidebar">
  <div class="sb-brand">
    <div class="sb-brand-mark" id="sbBrandMark">E</div>
    <div>
      <div class="sb-brand-name" id="sbBrandName">ExamEngine</div>
      <div class="sb-brand-ver">Pro · v12</div>
    </div>
  </div>
  <nav class="sb-nav" id="sbNavTeacher">
    <button class="sb-link active" id="sbDash" onclick="navTo('dash')"><span class="sb-ico">🏠</span> Dashboard</button>
    <button class="sb-link" id="sbNew" onclick="navTo('new')"><span class="sb-ico">📝</span> Set Questions</button>
    <div class="sb-divider"></div>
    <button class="sb-link" id="sbLoad" onclick="navTo('load')"><span class="sb-ico">📂</span> Load / View Questions</button>
    <button class="sb-link" id="sbArch" onclick="navTo('arch')"><span class="sb-ico">🗄</span> Archive</button>
    <div class="sb-divider"></div>
    <button class="sb-link" id="sbSett" onclick="navTo('sett')"><span class="sb-ico">⚙</span> Settings</button>
  </nav>
  <nav class="sb-nav" id="sbNavAdmin" style="display:none;">
    <button class="sb-link" id="sbAdminDash" onclick="navTo('admin-dash')"><span class="sb-ico">🗂</span> Production Queue <span id="adminNewBadge" style="display:none;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;margin-left:auto;"></span></button>
    <button class="sb-link" id="sbAdminPrint" onclick="navTo('admin-print')"><span class="sb-ico">🔬</span> Digital Lab</button>
    <div class="sb-divider"></div>
    <button class="sb-link" id="sbAdminSett" onclick="navTo('admin-sett')"><span class="sb-ico">⚙</span> Admin Settings</button>
  </nav>
  <div class="sb-foot">
    <div class="sb-api-status">
      <div class="sb-dot" id="sbDot"></div>
      <span id="sbApiLbl">No API Key</span>
    </div>
    <div>ExamEngine Pro · NERDC 2026</div>
  </div>
  <div class="role-switcher" id="roleSwitcher">
    <div class="role-sw-label">Active Portal</div>
    <div class="role-sw-btns">
      <button class="role-sw-btn active" id="swTeacher" onclick="switchRole('teacher')">👨‍🏫<br/>Teacher</button>
      <button class="role-sw-btn admin" id="swAdmin" onclick="switchRole('admin')">🛡<br/>Admin</button>
    </div>
  </div>
</div>
</div>

<!-- ══ NAV ═════════════════════════════ -->
<div id="c-nav">
<header id="nav">
  <div class="nav-in">
    <button class="nav-hamburger" onclick="openSidebar()" title="Menu">☰</button>
    <div class="logo"><div class="logo-mark">E</div>ExamEngine</div>
    <div class="steps" id="stps"></div>
    <div class="nav-r">
      <button class="nav-back-btn" id="globalBackBtn" onclick="goBack()" title="Back" style="display:none;">← Back</button>
      <span id="navRoleBadge" class="role-badge teacher" style="margin-right:4px;">Teacher</span>
      <div class="api-chip" id="apiChip">
        <div class="api-dot" id="apiDot"></div>
        <span id="apiLbl">No API Key</span>
      </div>
      <div id="queueChip" style="display:none;font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:20px;background:var(--amber-lt);border:1.5px solid var(--amber-bdr);color:var(--amber);font-family:var(--mono);">⏳ <span id="queueLbl">queuing…</span></div>
      <div class="user-chip" onclick="doLogout()" title="Click to sign out">
        <span>👤</span>
        <span class="user-chip-name" id="userChipName">…</span>
      </div>
    </div>
  </div>
</header>
</div>

<!-- ══ SCREENS ══════════════════════════ -->
<div id="c-screens">
<div id="screen-dash"></div>
<div id="screen-gate" style="display:none;"></div>
<div id="screen-load" style="display:none;"></div>
<div id="screen-arch" style="display:none;"></div>
<div id="screen-sett" style="display:none;"></div>

<!-- ══ ADMIN SCREENS ════════════════════ -->
<div id="screen-admin-dash" style="display:none;"></div>
<div id="screen-admin-print" style="display:none;"></div>
<div id="screen-admin-sett" style="display:none;"></div>

<div id="app" style="display:none;">
  <div id="s1"></div>
  <div id="s2" style="display:none;"></div>
  <div id="s3" style="display:none;"></div>
</div>

<!-- Economy Print Frame (Phase 1 — do not remove) -->
<div id="eco-print-frame" style="display:none;"></div>

<!-- Phase 1 print target (do not remove) -->
<div id="pp"></div>

<!-- Digital Lab Print Root — made visible on screen before window.print() -->
<div id="print-root" style="display:none;"></div>
<div id="toast"></div>
</div>

<script src="env.js"></script>
<script src="script.js"></script>
</body>
</html>
